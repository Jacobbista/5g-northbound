service: synthetic-adapter
description: Synthetic source. Walks each configured device through the first room of the blueprint and reports its position in that room's frame. Locates nothing real.

# kind: ui | api | internal. See camara-gateway/env.contract.yaml. Polled by the
# engine inside the cluster only.
kind: internal
external_origin: null

required: []

optional:
  - name: POSITIONING_ENGINE_URL
    type: url
    default: ""
    sensitive: false
    description: Engine base URL. The adapter reads the blueprint from GET /blueprint there and registers with the engine's adapter registry.

  - name: ADAPTER_NAME
    type: string
    default: ""
    sensitive: false
    description: Name this adapter registers under, the `source` of the assets it serves. Registration is off when unset.

  - name: ADAPTER_BASE_URL
    type: url
    default: ""
    sensitive: false
    description: URL at which the engine reaches this adapter, its in-cluster Service URL. Required for registration.

  - name: ADAPTER_CAPABILITIES
    type: json
    default: "{}"
    sensitive: false
    description: "JSON object merged over the image's adapter.contract.yaml: source, kinds, frame, z, accuracy_class, reporting. See docs/adapters.md#what-an-adapter-declares."

  - name: SOURCE
    type: string
    default: synthetic
    sensitive: false
    description: The `source` written on every measurement.

  - name: DEVICE_IDS
    type: string
    default: ""
    sensitive: false
    description: Comma-separated device ids this adapter serves. Any other id answers 404. Empty serves every id.

  - name: ANCHOR_IDS
    type: string
    default: ""
    sensitive: false
    description: Comma-separated fixed infrastructure ids, listed on GET /devices with role infrastructure. They have no position.

  - name: SOURCE_CLASS
    type: string
    default: uwb
    sensitive: false
    description: The positioning technology the synthetic source stands in for, reported as sourceClass on GET /devices.

  - name: SPAWN_REQUIRED
    type: boolean
    default: "false"
    sensitive: false
    description: When true a device reports no position until it is placed with PUT /devices/{id}/placement, and none again once removed.

  - name: LAYOUT_PATH
    type: path
    default: ""
    sensitive: false
    description: Blueprint file read when the engine does not serve one. Unset in the cluster.

  - name: WIDTH_M
    type: number
    default: "20.0"
    sensitive: false
    description: Room width in metres, used when no blueprint is available.

  - name: DEPTH_M
    type: number
    default: "30.0"
    sensitive: false
    description: Room depth in metres, used when no blueprint is available.

  - name: HEIGHT_M
    type: number
    default: "3.0"
    sensitive: false
    description: Room height in metres.

  - name: SPEED_MPS
    type: number
    default: "1.0"
    sensitive: false
    description: Walking speed in metres per second.

  - name: ACCURACY_MIN_M
    type: number
    default: "1.5"
    sensitive: false
    description: Lower bound of the reported accuracy radius, in metres.

  - name: ACCURACY_MAX_M
    type: number
    default: "6.0"
    sensitive: false
    description: Upper bound of the reported accuracy radius, in metres.

  - name: CONFIDENCE_MIN
    type: number
    default: "0.35"
    sensitive: false
    description: Lower bound of the reported confidence.

  - name: CONFIDENCE_MAX
    type: number
    default: "0.95"
    sensitive: false
    description: Upper bound of the reported confidence.

  - name: DEGRADE_PROBABILITY
    type: number
    default: "0.015"
    sensitive: false
    description: Probability per second that a period of degraded accuracy starts.

  - name: DEGRADE_SECONDS
    type: number
    default: "8.0"
    sensitive: false
    description: Duration of a period of degraded accuracy, in seconds.

  - name: RNG_SEED
    type: integer
    default: "0"
    sensitive: false
    description: Seed for reproducible walks. 0 draws a new walk at every start.
