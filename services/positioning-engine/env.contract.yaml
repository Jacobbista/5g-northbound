service: positioning-engine
description: Fuses Measurements from configured adapters into a final position. Polls each adapter and broadcasts on a WebSocket loop.

# kind: ui | api | internal. See camara-gateway/env.contract.yaml for the
# meaning. The engine is cluster-only; the gateway is its sole consumer.
kind: internal
external_origin: null

required:
  - name: ADAPTER_URLS
    description: Comma-separated `name=url` entries, one per adapter the engine should poll. Empty = no measurements.
    sensitive: false
    example: wifi=http://wifi-positioning:8080,wittra=http://rest-adapter:8080

  - name: DEVICE_IDS
    description: Comma-separated list of device IDs the engine actively tracks.
    sensitive: false
    example: wifi-asset-01,wittra-tag-01

optional:
  - name: DEVICE_MAP
    default: ""
    sensitive: false
    description: Pin specific devices to specific adapters; comma-separated `device_id=adapter_name`.

  - name: FUSION_STRATEGY
    default: weighted_avg
    sensitive: false
    description: Strategy applied to merged measurements. See docs/fusion-strategies.md.

  - name: FUSION_COMPARE
    default: ""
    sensitive: false
    description: Optional second strategy to run side-by-side for evaluation.

  - name: BLUEPRINT_PATH
    default: /app/data/blueprint.json
    sensitive: false
    description: Writable path where the engine persists the canonical blueprint (it is the blueprint authority, served over GET/PUT /blueprint). Mount a writable PVC here in production.

  - name: BLUEPRINT_SEED_PATH
    default: ""
    sensitive: false
    description: Optional read-only layout.json migrated into BLUEPRINT_PATH on first boot when the store is empty. Leave unset in steady state; the placement-editor PUTs the blueprint over HTTP.

  - name: WEBSOCKET_INTERVAL_MS
    default: "500"
    sensitive: false
    description: Broadcast cadence in milliseconds. Keep above 500 to avoid wasted wake-ups.
