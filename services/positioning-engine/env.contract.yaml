service: positioning-engine
description: Fuses Measurements from configured adapters into a final position. Polls each adapter and broadcasts on a WebSocket loop.

# kind: ui | api | internal. See camara-gateway/env.contract.yaml for the
# meaning. The engine is cluster-only; the gateway is its sole consumer.
kind: internal
external_origin: null

required:
  - name: DEVICE_IDS
    description: Comma-separated list of device IDs the engine actively tracks.
    sensitive: false
    example: wifi-asset-01,wittra-tag-01

optional:
  - name: ADAPTER_URLS
    default: ""
    sensitive: false
    description: Cold-start SEED only (`name=url,...`). Applied once to an empty registry; adapters self-register at runtime (POST /adapters) and the live/persisted registry is authoritative. Leave empty when adapters self-register. See docs/adapter-registry.md.

  - name: ADAPTER_REGISTRY_PATH
    default: /app/data/adapters.json
    sensitive: false
    writable: true
    description: Writable path where the engine persists seed/manual adapter registrations (same volume as the blueprint). Self-registered entries are not persisted. Needs a PVC.

  - name: ADAPTER_TTL_S
    default: "45"
    sensitive: false
    description: Seconds without a heartbeat before a self-registered adapter is evicted. Seed/manual entries are never TTL-evicted.

  - name: ADAPTER_HEARTBEAT_S
    default: "15"
    sensitive: false
    description: Expected adapter heartbeat cadence; an entry older than one interval (within TTL) shows as "stale".

  - name: DEVICE_MAP
    default: ""
    sensitive: false
    description: Optional cold-start override pinning device_id=adapter_name (comma-separated). Routing is capability-driven by default - the gateway passes the asset's source (?source=) and the engine fans out otherwise, so this is normally unset.

  - name: FUSION_STRATEGY
    default: weighted_avg
    sensitive: false
    description: Strategy applied to merged measurements. See docs/fusion-strategies.md.

  - name: FUSION_COMPARE
    default: ""
    sensitive: false
    description: Optional second strategy to run side-by-side for evaluation.

  - name: BLUEPRINT_PATH
    default: /app/data/blueprint.json
    sensitive: false
    writable: true
    description: Writable path where the engine persists the canonical blueprint (it is the blueprint authority, served over GET/PUT /blueprint). Mount a writable PVC here in production.

  - name: BLUEPRINT_SEED_PATH
    default: ""
    sensitive: false
    description: Optional read-only layout.json migrated into BLUEPRINT_PATH on first boot when the store is empty. Leave unset in steady state; the placement-editor PUTs the blueprint over HTTP.

  - name: WEBSOCKET_INTERVAL_MS
    default: "500"
    sensitive: false
    description: Broadcast cadence in milliseconds. Keep above 500 to avoid wasted wake-ups.
