# Env contract for camara-gateway.
# Consumed by the future deploy portal to render a config form and emit
# k8s Secret + ConfigMap manifests. See STRUCTURE.md for the conventions.
service: camara-gateway
description: Northbound CAMARA Location Retrieval v0.5 + Verification v3 REST API. Validates JWTs against Keycloak.

# kind drives how a deploy dashboard treats the service:
#   ui       - browser-facing, needs an ingress + a public origin
#   api      - reached from outside the cluster by API clients, needs an ingress
#   internal - cluster-only, no ingress
kind: api
# Logical name under which the deploy portal tracks this service's public URL
# once it assigns an ingress host (so consumers can be wired to it). null for
# pure internal services. This is metadata for the portal; the app does not
# read this variable.
external_origin: CAMARA_GATEWAY_EXTERNAL_ORIGIN

# Required at runtime; deployment must supply a value for every entry here.
required:
  - name: KEYCLOAK_URL
    description: Base URL of the Keycloak instance issuing JWTs.
    sensitive: false
    example: http://keycloak.iam.svc.cluster.local:8080/auth

  - name: KEYCLOAK_REALM
    description: Realm name the gateway validates tokens against.
    sensitive: false
    example: 5g-testbed

  - name: POSITIONING_ENGINE_URL
    description: Internal URL of the positioning-engine service.
    sensitive: false
    set_by: compose
    example: http://positioning-engine:8080

# Optional; sensible defaults baked into config.py.
optional:
  - name: WIFI_POSITIONING_URL
    default: ""
    sensitive: false
    set_by: compose
    description: Internal URL of wifi-positioning, proxied by /anchors/calibration so the demo reads real per-AP RF. Empty disables the extension.

  - name: REQUIRED_ROLE
    default: camara-location-read
    sensitive: false
    description: Keycloak realm role required on the access token.

  - name: ASSET_STORE_FILE
    default: /app/data/assets.json
    sensitive: false
    set_by: compose
    writable: true
    consumed_by: [camara-gateway]
    description: >-
      Path to the writable Asset Identity Map store (PVC). The gateway is the
      network authority for assets (GET/PUT /assets), mirroring the engine's
      blueprint store. The path is not sensitive; the FILE CONTENT is Tier-1
      (org/asset inventory) - persisted on a PVC in prod, gitignored in dev,
      never committed.

  - name: ASSET_SEED_FILE
    default: /app/config/assets.seed.json
    sensitive: false
    set_by: compose
    consumed_by: [camara-gateway]
    description: >-
      Path to a read-only seed used once on first boot when the store is empty
      (then persisted to ASSET_STORE_FILE). Conforms to schema/asset.schema.json.

  - name: CAMARA_CLIENT_SECRET
    default: changeme
    sensitive: true
    set_by: secret
    description: Keycloak client secret for the camara-gateway confidential client.

  - name: SKIP_AUTH
    default: "false"
    sensitive: false
    description: DEV ONLY. When true, all JWT validation is bypassed. Never enable in production.
