# Adapter capability contract for vendor-adapter (Wittra UWB cloud).
# Declarative source of truth; runtime value travels in ADAPTER_CAPABILITIES
# (JSON). `make positioning-check` asserts the two agree. The vendor is
# schema-driven (examples/wittra-schema.json); these capabilities describe the
# positioning traits the engine/gateway reason about.
adapter: wittra
description: Schema-driven REST bridge to a vendor positioning cloud (Wittra UWB).
capabilities:
  source: wittra
  kinds: [pallet, uwb-tag, asset]
  frame: wgs84          # vendor returns WGS84; engine inverts to local
  streaming: false      # rest transport = pull-through (transport is a schema dimension; mqtt future)
  z: true               # UWB reports height
  accuracy_class: sub-metre
  discover: true         # exposes /discover (vendor device enumeration); editor shows SYNC {source}
  devices: true          # exposes /devices (vendor inventory for onboarding, standard shape)
  diagnostics: true      # exposes /diagnostics/{id} (vendor fidelity telemetry, on-demand)
