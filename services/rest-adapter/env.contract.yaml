service: rest-adapter
description: Schema-driven adapter that translates a vendor REST cloud (Wittra et al.) into the engine's Measurement contract. The actual env contract is *schema-defined* - variable NAMES come from the active schema at SCHEMA_FILE. Defaults below match examples/wittra-schema.json.

# kind: ui | api | internal. Cluster-only: the engine polls it; it calls OUT
# to the vendor cloud but is never reached from outside.
kind: internal
external_origin: null

required:
  # Variable names below come from wittra-schema.json. Swap them for the
  # names declared by whatever schema the deployment activates.
  - name: WITTRA_ORG_ID
    description: Wittra organization slug. Used both in the URL path and as the HTTP basic-auth username.
    sensitive: false
    example: my-org

  - name: WITTRA_PROJECT_ID
    description: Wittra project under that organization. URL path variable.
    sensitive: false
    example: my-project

  - name: WITTRA_API_KEY
    description: HTTP basic-auth password issued by the Wittra portal.
    sensitive: true
    set_by: secret

optional:
  - name: WITTRA_BASE_URL
    default: https://api.wittra.se
    sensitive: false
    description: Override the schema's default base URL. Point at the local mock-wittra for stand-alone demos.

  - name: SCHEMA_FILE
    default: /app/data/schema.json
    sensitive: false
    writable: true
    description: "Path the active vendor schema JSON is read from. Production - mount a ConfigMap here (read-only) and change it + kubectl rollout restart; this is the durable, versioned write path. PUT /schema is a dev/preview hot-patch only - on a read-only ConfigMap/subPath mount it applies the schema live but returns persisted:false, and the ConfigMap re-wins on the next restart. In compose it is bind-mounted from examples/ for the demo (writable there, so PUT persists in dev)."

  - name: REST_ADAPTER_DEBUG
    default: "0"
    sensitive: false
    description: Set to "1" to log GET URLs + response previews. Useful when wiring a new vendor or chasing a cloud returning 0 devices.

  - name: POSITIONING_ENGINE_URL
    default: ""
    sensitive: false
    description: Engine adapter-registry URL. When set with ADAPTER_NAME + ADAPTER_BASE_URL, the adapter self-registers (POST /adapters) + heartbeats. See docs/adapter-registry.md.

  - name: ADAPTER_NAME
    default: ""
    sensitive: false
    description: Name this adapter registers under (must match the engine's DEVICE_MAP). Self-registration disabled when unset.

  - name: ADAPTER_KIND
    default: adapter
    sensitive: false
    description: Free-form classification surfaced on GET /adapters (e.g. vendor).

  - name: ADAPTER_BASE_URL
    default: ""
    sensitive: false
    description: URL the engine uses to poll this adapter (its own in-cluster Service URL). Required for self-registration.
