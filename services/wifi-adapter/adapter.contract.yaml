# Adapter capability contract for wifi-adapter.
# Declarative source of truth; runtime value travels in ADAPTER_CAPABILITIES
# (JSON). `make positioning-check` asserts the two agree.
adapter: wifi
description: WiFi RSSI trilateration against calibrated anchors.
capabilities:
  source: wifi
  kinds: [tool, asset]
  frame: room           # fixes in the frame of the room the anchors belong to
  streaming: false
  z: false              # 2D trilateration, no height estimate
  accuracy_class: metre
  calibration: true     # exposes the /calibration tool; editor shows CALIBRATE
  devices: true         # exposes /devices (observed device enumeration for onboarding)
  # A fix per scan from the edge scanner, one scan a second by default. The
  # interval is the longest gap the source guarantees, transport included.
  reporting: periodic
  reportingInterval: 2
