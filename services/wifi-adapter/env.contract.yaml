service: wifi-adapter
description: WiFi RSSI multilateration adapter. Receives scans from the edge scanner on the 5G data network; resolves device → position using AP positions from the blueprint and BSSIDs from the bindings file.

# kind: ui | api | internal. Cluster-only: the engine polls it and the edge
# scanner reaches it via internal cluster DNS (kubedge joins the edge node to
# the cluster network), so it needs no public ingress.
kind: internal
external_origin: null

required: []

optional:
  - name: WIFI_CONFIG_PATH
    type: path
    default: /app/config/wifi-config.json
    sensitive: false
    set_by: compose
    writable: true
    description: Path to the bindings file (id → BSSIDs + per-AP tx_power / path_loss_n overrides). The calibration apply path WRITES here, so it needs a PVC (seeded from the committed bindings), not a read-only ConfigMap mount, or runtime calibration is lost on restart/upgrade.

  - name: POSITIONING_ENGINE_URL
    type: url
    default: http://positioning-engine:8080
    sensitive: false
    description: Engine = blueprint authority + adapter registry. The adapter GETs /blueprint here (retry + degraded) and self-registers (POST /adapters) + heartbeats.

  - name: ADAPTER_NAME
    type: string
    default: ""
    sensitive: false
    description: Name this adapter registers under, the `source` of the assets it serves. Registration is off when unset.

  - name: ADAPTER_BASE_URL
    type: url
    default: ""
    sensitive: false
    description: URL the engine uses to poll this adapter (its own in-cluster Service URL). Required for self-registration.

  - name: ADAPTER_HEARTBEAT_S
    type: number
    default: "15"
    sensitive: false
    description: Seconds between two registrations with the engine. Keep below the engine's ADAPTER_TTL_S.

  - name: ADAPTER_CAPABILITIES
    type: json
    default: "{}"
    sensitive: false
    description: "JSON object merged over the image's adapter.contract.yaml: source, kinds, frame, z, accuracy_class, nominalAccuracy, reporting, reportingInterval. A source that reports no accuracy per fix needs accuracy_class or nominalAccuracy here, or its measurements are dropped. See docs/adapters.md#what-an-adapter-declares."

  - name: LAYOUT_PATH
    type: path
    default: ""
    sensitive: false
    description: Offline fallback only - a local blueprint file used when the engine is unreachable. Unset in the cluster (blueprint comes from the engine).

  - name: WIFI_DEBUG
    type: boolean
    default: "0"
    sensitive: false
    description: Set to "1" to log per-scan trilateration diagnostics. Useful when tuning tx_power / path_loss_n against a real venue.
