service: positioning-demo
description: Browser MEC application that consumes the CAMARA gateway only. All config is RUNTIME (window.__ENV__), rendered into /usr/share/nginx/html/env-config.js by entrypoint.sh at container start so a k8s ConfigMap / Secret update survives only a pod restart.

required:
  - name: VITE_CAMARA_API_BASE
    description: Public URL of the CAMARA gateway (visible to the browser).
    sensitive: false
    example: https://camara.testbed.example.com
    runtime_layer: window.__ENV__

  - name: VITE_KEYCLOAK_URL
    description: Public URL of the Keycloak server (visible to the browser).
    sensitive: false
    example: https://keycloak.testbed.example.com
    runtime_layer: window.__ENV__

optional:
  - name: VITE_KEYCLOAK_REALM
    default: 5g-testbed
    sensitive: false
    description: Realm name the demo authenticates against.
    runtime_layer: window.__ENV__

  - name: VITE_KEYCLOAK_CLIENT_ID
    default: positioning-demo
    sensitive: false
    description: Public client id (PKCE) configured in the realm.
    runtime_layer: window.__ENV__

  - name: VITE_GPS_ORIGIN_LAT
    default: "45.064312"
    sensitive: false
    description: GPS reference latitude used to project CAMARA area.center back into the local floor frame. Must match the engine's floor-plan gps_origin.
    runtime_layer: window.__ENV__

  - name: VITE_GPS_ORIGIN_LON
    default: "7.659154"
    sensitive: false
    description: GPS reference longitude. See VITE_GPS_ORIGIN_LAT.
    runtime_layer: window.__ENV__

  - name: VITE_FLOOR_W
    default: "13"
    sensitive: false
    description: Floor plan width in metres (must match engine).
    runtime_layer: window.__ENV__

  - name: VITE_FLOOR_D
    default: "32"
    sensitive: false
    description: Floor plan depth in metres (must match engine).
    runtime_layer: window.__ENV__

  - name: VITE_ACCURACY_MAX_M
    default: "15"
    sensitive: false
    description: Reported fix accuracy (metres) above which a device renders greyed-out / "imprecise" instead of live. Guards against confident-looking dots from degenerate trilateration fixes.
    runtime_layer: window.__ENV__
