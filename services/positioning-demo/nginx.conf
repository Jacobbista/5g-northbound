server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /env-config.js {
        add_header Cache-Control "no-cache";
    }

    location = /layout.json {
        add_header Cache-Control "no-cache";
    }

    # Env contract (schema only, baked at build). Same shape as the FastAPI
    # services' GET /contract so a deploy dashboard reads all services alike.
    location = /contract {
        default_type application/json;
        try_files /contract.json =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
