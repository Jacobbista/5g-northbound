service: wifi-positioning
description: WiFi RSSI multilateration adapter. Receives scans from the edge scanner on the 5G data network; resolves device → position using AP positions from the blueprint and BSSIDs from the bindings file.

required: []

optional:
  - name: WIFI_CONFIG_PATH
    default: /app/config/wifi-config.json
    sensitive: false
    description: Path to the bindings file (id → BSSIDs + per-AP tx_power / path_loss_n overrides). Mounted from a PVC in production so the calibration tool can persist updates.

  - name: LAYOUT_PATH
    default: ""
    sensitive: false
    description: Path to the blueprint (placement-editor JSON). When set, anchor positions are read from it and joined by id to the bindings file.

  - name: WIFI_DEBUG
    default: "0"
    sensitive: false
    description: Set to "1" to log per-scan trilateration diagnostics. Useful when tuning tx_power / path_loss_n against a real venue.
