service: placement-editor
description: Operator UI for authoring the floor-plan / room / anchors blueprint and per-vendor bindings. Backend proxies for the wifi calibration tool and the rest-adapter vendor discovery.

# kind: ui | api | internal. To the operator this IS the UI; its auth gate
# (oauth2-proxy) is plumbing. external_origin is a POINTER - the name of the
# variable under which the deploy portal tracks where this UI is publicly
# reachable (via its gate). The placement-editor image itself does NOT read
# this variable; the gate does. null only for pure internal services.
kind: ui
external_origin: PLACEMENT_EDITOR_EXTERNAL_ORIGIN

required: []

optional:
  - name: POSITIONING_ENGINE_URL
    default: http://positioning-engine:8080
    sensitive: false
    description: The editor reads and writes the canonical blueprint over HTTP from the positioning-engine (the blueprint authority). No shared blueprint PVC.

  - name: WIFI_POSITIONING_URL
    default: http://wifi-positioning:8080
    sensitive: false
    description: Upstream for the in-editor calibration proxy.

  - name: REST_ADAPTER_URL
    default: http://rest-adapter:8080
    sensitive: false
    set_by: compose
    description: Upstream for the vendor-sync discovery proxy.

  - name: CAMARA_GATEWAY_URL
    default: http://camara-gateway:8080
    sensitive: false
    set_by: compose
    description: Asset Identity Map authority, proxied at /api/assets (GET/PUT) for an onboarding client. Onboarding UI is the KELT dashboard's.

  - name: VITE_MAPBOX_TOKEN
    default: ""
    sensitive: true
    set_by: operator
    description: Optional Mapbox public token (starts with "pk."). When set, the editor exposes a "Satellite (Mapbox)" basemap that matches vendor portals (e.g. Wittra). Leave empty to use ESRI / Google only.
    runtime_layer: window.__ENV__
