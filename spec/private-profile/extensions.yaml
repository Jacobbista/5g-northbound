openapi: 3.0.3
info:
  title: Private-asset profile - management and extension endpoints
  version: 0.1.0
  description: >-
    The management and extension surface of the private-asset profile, served by
    the CAMARA gateway alongside the standard Device Location retrieve/verify
    APIs. These are private-profile extensions, not CAMARA Device Location: the
    Asset Identity Map that binds an asset to its positioning capabilities, the
    onboarding candidate list, the fused side-panel telemetry, the anchor RF
    calibration, placement of synthetic assets, the deployment capabilities,
    adapter health, and the read-only venue blueprint. On-demand vendor diagnostics are a separate document,
    device-diagnostics.yaml. The CAMARA core specs are unchanged.
servers:
  - url: https://{gateway}
    variables:
      gateway:
        default: localhost:8087
        description: CAMARA gateway host.
security:
  - bearerAuth: []
paths:
  /assets:
    get:
      summary: The Asset Identity Map for the caller's tenant.
      operationId: getAssets
      responses:
        "200":
          description: The current asset map, filtered to the token's org.
          content:
            application/json:
              schema:
                $ref: "https://jacobbista.github.io/5g-northbound/schema/asset.schema.json"
        "401":
          description: Missing or invalid bearer token.
    put:
      summary: Replace the Asset Identity Map.
      description: Replaces the whole map. Read, merge, write back; never blind-write.
      operationId: putAssets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "https://jacobbista.github.io/5g-northbound/schema/asset.schema.json"
      responses:
        "200":
          description: The stored map.
          content:
            application/json:
              schema:
                $ref: "https://jacobbista.github.io/5g-northbound/schema/asset.schema.json"
        "401":
          description: Missing or invalid bearer token.
  /assets/discoverable:
    get:
      summary: Devices the sources report that are not yet onboarded as assets.
      operationId: getDiscoverable
      responses:
        "200":
          description: Onboarding candidates, with any positioning id already mapped to a capability subtracted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverableResponse"
        "401":
          description: Missing or invalid bearer token.
  /assets/{assetId}/details:
    get:
      summary: Fused side-panel telemetry for one asset.
      description: >-
        Engine-side fields the CAMARA Location intentionally hides (strategy,
        the contributing sources, accuracy), fused across the asset's
        capabilities. `404` (not `403`) for a cross-tenant id so existence never
        leaks.
      operationId: getAssetDetails
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Asset details; `telemetry` is null when no capability has a fix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetDetails"
        "404":
          description: No such asset for this tenant.
  /anchors/calibration:
    get:
      summary: Measured per-anchor RF model (WiFi).
      description: Per-anchor fitted RF params keyed by anchor id. Empty when uncalibrated. BSSIDs are never exposed.
      operationId: getAnchorCalibration
      responses:
        "200":
          description: The calibration map.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnchorCalibration"
  /assets/{assetId}/placement:
    parameters:
      - name: assetId
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Place a synthetic asset at a point and start it reporting.
      description: >-
        Only an asset whose primary source advertises the `placement`
        capability can be placed. Placing a placed asset moves it. The point
        is in the frame of the room the source reports in, and the source
        clamps it into that room.
      operationId: putAssetPlacement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placement"
      responses:
        "200":
          description: Where the asset landed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacementResult"
        "404":
          description: No such asset for this tenant, or no adapter serves its source.
        "422":
          description: The source reports a measured position and cannot be placed.
        "502":
          description: The source rejected the placement.
        "503":
          description: The positioning fabric or the source is unreachable.
    delete:
      summary: Stop a synthetic asset reporting.
      description: The asset then has no position. Removing an asset that is not placed is not an error.
      operationId: deleteAssetPlacement
      responses:
        "200":
          description: The asset is not placed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacementResult"
        "404":
          description: No such asset for this tenant, or no adapter serves its source.
  /capabilities:
    get:
      summary: What this deployment can do now.
      description: >-
        Derived from the capabilities the adapters currently advertise and from
        the Asset Identity Map. A tenant-scoped token sees the kinds and orgs of
        its own assets only.
      operationId: getCapabilities
      responses:
        "200":
          description: The capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
  /adapters:
    get:
      summary: Health of each positioning adapter.
      description: The engine's adapter registry, passed through unchanged.
      operationId: getAdapters
      responses:
        "200":
          description: One entry per registered adapter.
          content:
            application/json:
              schema:
                type: object
                required: [adapters]
                properties:
                  adapters:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdapterStatus"
  /blueprint:
    get:
      summary: The venue blueprint.
      description: Read-only. The blueprint is authored in the placement editor and stored by the engine.
      operationId: getBlueprint
      responses:
        "200":
          description: The blueprint, in version 3.
          content:
            application/json:
              schema:
                $ref: "https://jacobbista.github.io/5g-northbound/schema/layout.schema.json"
        "404":
          description: The engine holds no blueprint.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Keycloak-issued JWT (realm role `camara-location-read`).
  schemas:
    DiscoverableResponse:
      type: object
      required: [candidates]
      properties:
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/DiscoverableDevice"
    DiscoverableDevice:
      type: object
      required: [id, source]
      properties:
        id:
          type: string
          description: The source's device id; becomes a capability's positioningId on onboarding.
        source:
          type: string
        origin:
          type: string
          description: "`inventory` (vendor registry) or `observed` (activity-seen)."
          nullable: true
        role:
          type: string
          description: "`asset` vs `infrastructure`; infrastructure is not onboardable."
          nullable: true
        sourceClass:
          type: string
          nullable: true
        deviceType:
          type: string
          nullable: true
        label:
          type: string
          nullable: true
        lastSeen:
          type: number
          nullable: true
    AssetDetails:
      type: object
      required: [assetId, positioningId, kind, source, org, label]
      properties:
        assetId: { type: string }
        positioningId:
          type: string
          description: The primary capability's positioning id.
        kind: { type: string }
        source:
          type: string
          description: The primary capability's source.
        org: { type: string }
        label: { type: string }
        telemetry:
          $ref: "#/components/schemas/AssetTelemetry"
          nullable: true
    AssetTelemetry:
      type: object
      required: [latitude, longitude, accuracy, lastLocationTime, strategy, sources]
      properties:
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        accuracy: { type: number, format: double }
        altitude:
          type: number
          format: double
          nullable: true
        lastLocationTime: { type: string, format: date-time }
        strategy: { type: string }
        sources:
          type: array
          items: { type: string }
          description: Every source that contributed to the fused fix.
    AnchorCalibration:
      type: object
      required: [params]
      properties:
        params:
          type: object
          description: Anchor id -> fitted RF model.
          additionalProperties:
            type: object
            properties:
              txPowerRef: { type: number }
              pathLossExponent: { type: number }
              calibrated: { type: boolean }
    Placement:
      type: object
      required: [x, y]
      description: A point in metres from the room's lower-left corner, x along the width, y along the depth.
      properties:
        x: { type: number, format: double, x-unit: m }
        y: { type: number, format: double, x-unit: m }
    PlacementResult:
      type: object
      required: [assetId, placed]
      properties:
        assetId: { type: string }
        placed: { type: boolean }
        room:
          type: string
          nullable: true
          description: The room whose frame x and y are in. Absent when the asset is not placed.
        x: { type: number, format: double, x-unit: m, nullable: true }
        y: { type: number, format: double, x-unit: m, nullable: true }
    AdapterCapabilities:
      type: object
      description: >-
        What an adapter declares about itself. The keys are listed in
        docs/adapters.md, "What an adapter declares about itself".
      additionalProperties: true
    Capabilities:
      type: object
      required: [profile, kinds, sources, orgs, streaming, altitude, accuracyClasses, adapters]
      properties:
        profile: { type: string }
        kinds: { type: array, items: { type: string } }
        sources: { type: array, items: { type: string } }
        orgs: { type: array, items: { type: string } }
        streaming:
          type: boolean
          description: At least one adapter pushes its fixes.
        altitude:
          type: boolean
          description: At least one adapter declares `z`, so an altitude can be reported.
        accuracyClasses: { type: array, items: { type: string } }
        adapters:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              source: { type: string, nullable: true }
              state: { type: string, nullable: true }
              capabilities:
                $ref: "#/components/schemas/AdapterCapabilities"
    AdapterStatus:
      type: object
      required: [name, state]
      properties:
        name: { type: string }
        baseUrl: { type: string }
        kind: { type: string }
        registeredVia: { type: string }
        state:
          type: string
          enum: [live, stale, unreachable]
        failCount: { type: integer }
        inCooldown: { type: boolean }
        cooldownSecondsRemaining: { type: number, x-unit: s }
        lastSeenSAgo: { type: number, x-unit: s }
        capabilities:
          $ref: "#/components/schemas/AdapterCapabilities"
