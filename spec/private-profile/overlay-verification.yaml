overlay: 1.0.0
info:
  title: CAMARA Device Location Verification - private-asset profile overlay
  version: 0.2.0
# Applies to ../../services/camara-gateway/spec/location-verification.yaml
# (CAMARA r3.2, pinned). Same asset-identity delta as the retrieval overlay; the
# verification response (TRUE/FALSE/PARTIAL + matchRate) is already in the base.
# Apply with `make profile-spec` (or any OpenAPI Overlay tool, e.g. Redocly).
actions:
  - target: $.components.schemas.Device.description
    update: |
      Private-asset profile: the tracked entity is an ASSET, identified by
      `assetId`. `networkAccessIdentifier` is accepted only as the asset alias
      `<asset_id>@<org>.assets`. Public-network identifiers (phoneNumber, IP)
      are not part of this profile.
  - target: $.components.schemas.Device.properties
    update:
      assetId:
        type: string
        pattern: '^[A-Za-z0-9._:-]{1,128}$'
        description: First-class asset identifier (private-asset profile).
        example: pkg-4471
  - target: $.components.schemas.LastLocationTime.description
    update: |
      The latest date and time at which the position of the asset was
      established: by a new fix, or, for a source that reports on motion, by a
      communication from the device after that fix, which confirms that the
      asset has not moved. It must follow RFC 3339 and must have time zone.
      maxAge is judged on this time. maxAge=0 accepts only a position as recent
      as its sources can provide.
  - target: $.components.schemas.Device.properties.phoneNumber
    remove: true
  - target: $.components.schemas.Device.properties.ipv4Address
    remove: true
  - target: $.components.schemas.Device.properties.ipv6Address
    remove: true
  # The base examples identify the device by phone number or IP, or omit it.
  # The profile refuses all three, so its examples use assetId.
  - target: $.paths./verify.post.requestBody.content.application/json.examples
    remove: true
  - target: $.paths./verify.post.requestBody.content.application/json.examples
    update:
      INPUT_ASSET_ID_CIRCLE:
        summary: Asset identifier, circle and maxAge
        description: Verify whether an asset lies within a circle, accepting a position established at most 120 seconds ago
        value:
          device:
            assetId: pkg-4471
          area:
            areaType: CIRCLE
            center:
              latitude: 59.404210
              longitude: 17.949278
            radius: 50
          maxAge: 120
  - target: $.paths./verify.post.responses.200.content.application/json.examples.VERIFICATION_TRUE_WITH_DEVICE
    remove: true
