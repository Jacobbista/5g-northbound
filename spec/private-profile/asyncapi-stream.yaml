asyncapi: 3.0.0
info:
  title: CAMARA private-asset profile - streaming delivery
  version: 0.1.0
  description: |
    The streaming half of the private-asset profile (delivery gap). OpenAPI
    covers the pull request/response surface (see the overlays in this folder);
    this AsyncAPI document formalises the push channel, which is a WebSocket and
    therefore outside OpenAPI's scope.

    The gateway enriches the engine broadcast into asset-shaped events and drops
    any positioning id with no registered asset behind it (same no-raw-id rule
    and org-scoping as the pull path).
servers:
  gateway:
    host: localhost:8087
    protocol: ws
    description: CAMARA gateway. Production is `wss` behind the ingress.
    security:
      - $ref: '#/components/securitySchemes/bearerSubprotocol'
channels:
  positions:
    address: /positions/stream
    description: |
      Live asset positions. Browsers cannot set an Authorization header on a
      WebSocket handshake, so the bearer token rides the Sec-WebSocket-Protocol
      header: the client offers ["bearer.jwt", "<jwt>"] and the gateway echoes
      "bearer.jwt" to accept. This keeps the token out of the URL (RFC 6750
      section 5.3). Close codes: 4401 (auth failed), 1011 (upstream engine
      unavailable), 1000 (clean shutdown).
    messages:
      positionBatch:
        $ref: '#/components/messages/positionBatch'
operations:
  receivePositions:
    action: receive
    channel:
      $ref: '#/channels/positions'
    summary: Receive live asset-position batches pushed by the gateway.
    messages:
      - $ref: '#/channels/positions/messages/positionBatch'
components:
  securitySchemes:
    bearerSubprotocol:
      type: httpApiKey
      in: header
      name: Sec-WebSocket-Protocol
      description: >-
        A Keycloak-issued JWT (realm role `camara-location-read`), carried as the
        second WebSocket subprotocol after the `bearer.jwt` marker:
        `Sec-WebSocket-Protocol: bearer.jwt, <jwt>`. Not a URL query parameter
        (RFC 6750 section 5.3).
  messages:
    positionBatch:
      name: positionBatch
      title: Asset position batch
      contentType: application/json
      summary: One JSON array, one entry per asset that currently has a fix.
      payload:
        $ref: '#/components/schemas/PositionEventArray'
  schemas:
    PositionEventArray:
      type: array
      items:
        $ref: '#/components/schemas/PositionEvent'
    PositionEvent:
      type: object
      required:
        - assetId
        - latitude
        - longitude
        - timestamp
      properties:
        assetId:
          type: string
          description: CAMARA asset identifier (private-asset profile).
          example: pkg-4471
        positioningId:
          type: string
          description: Internal/vendor-native id the engine fuses on.
          example: wittra-tag-01
        source:
          type: string
          example: wittra
        kind:
          type: string
          example: pallet
        org:
          type: string
          description: Tenant; the gateway drops cross-tenant entries before sending.
          example: acme
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        altitude:
          type: number
          format: double
          nullable: true
        accuracy:
          type: number
          format: double
        timestamp:
          type: string
          format: date-time
          description: >-
            The estimate time (lastLocationTime), not the send time. This is the
            fix time and freezes while a stationary asset keeps reporting the
            same fix - use it for position age, not for liveness.
        observedAt:
          type: string
          format: date-time
          description: >-
            The broadcast tick on which this item was sent. It is fresh on every
            tick for as long as the source keeps answering, so it cannot reveal a
            device that has stopped reporting. Use it for transport latency and
            debugging, never for liveness - see `lastCommunicationTime`.
        lastCommunicationTime:
          type: string
          format: date-time
          description: >-
            When the DEVICE last communicated with its source; the most recent
            across the fused sources. This is the liveness clock: unlike
            `timestamp` it does not freeze for a still asset that keeps
            reporting, and unlike `observedAt` it ages when the device goes
            quiet. Absent when no contributing source exposes such a signal, in
            which case a consumer has no liveness signal and should say so
            rather than assume the device is live. Cadence is vendor-specific and
            may be adaptive (sparse while still, frequent while moving), so
            compare the age against the device's own observed rhythm rather than
            one fixed threshold.
        sources:
          type: array
          description: >-
            The technologies behind the fix. A multi-capability asset is fused
            from several sources, so this lists all that contributed this tick;
            a single-capability asset lists one.
          items:
            type: string
        strategy:
          type: string
          example: weighted_avg
        diagnostics:
          type: object
          description: >-
            Private-profile extension (not CAMARA). Stream-tier diagnostics
            carried from the routed source; grouped under this named container,
            never mixed into the CAMARA fields above. Core vocabulary fields
            (here, moving) use standard names; vendor-specific extras sit under
            vendorSpecific, raw. See docs/profile-extensions.md#core-vocabulary.
            Present only when the source reports it.
          properties:
            moving:
              type: boolean
              description: Derived from the omlox-standard speed, or a vendor state.
              example: false
            vendorSpecific:
              type: object
              description: Vendor fields with no normalized meaning, passed raw.
              additionalProperties: true
