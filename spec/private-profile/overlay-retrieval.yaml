overlay: 1.0.0
info:
  title: CAMARA Device Location Retrieval - private-asset profile overlay
  version: 0.1.0
# Applies to ../../services/camara-gateway/spec/location-retrieval.yaml (CAMARA
# r3.2, pinned). Formalises the schema deltas of the private-asset profile; the
# base document is never hand-edited. Behavioural conformance (maxAge, maxSurface
# - already in the base schema - and the error codes) and the streaming channel
# (a WebSocket, outside OpenAPI's scope) are described in README.md.
# Apply with `make profile-spec` (or any OpenAPI Overlay tool, e.g. Redocly).
actions:
  - target: $.components.schemas.Device.description
    update: |
      Private-asset profile: the tracked entity is an ASSET, identified by
      `assetId`. `networkAccessIdentifier` is accepted only as the asset alias
      `<asset_id>@<org>.assets`. Public-network identifiers (phoneNumber, IP)
      are not part of this profile.
  - target: $.components.schemas.Device.properties
    update:
      assetId:
        type: string
        pattern: '^[A-Za-z0-9._:-]{1,128}$'
        description: First-class asset identifier (private-asset profile).
        example: pkg-4471
  - target: $.components.schemas.Device.properties.phoneNumber
    remove: true
  - target: $.components.schemas.Device.properties.ipv4Address
    remove: true
  - target: $.components.schemas.Device.properties.ipv6Address
    remove: true
  - target: $.components.schemas.Location.properties
    update:
      source:
        type: string
        description: Positioning modality behind the fix (e.g. wittra, wifi, gnss).
        example: wittra
      kind:
        type: string
        description: Asset class (e.g. pallet, tool, forklift).
        example: pallet
      altitude:
        type: number
        format: double
        description: Fused vertical position in metres (profile extension).
      verticalAccuracy:
        type: number
        format: double
        description: Vertical 1-sigma uncertainty in metres, when available.
