openapi: 3.0.3
info:
  title: Device diagnostics - private-asset profile extension
  version: 0.1.0
  description: |
    A private-profile extension surface, NOT CAMARA Device Location. It exposes
    device diagnostics that the CAMARA Device Location payloads intentionally do
    not carry. Core vocabulary fields (battery, last_seen, accuracy, moving)
    surface at the top of the payload with standard names and units; any
    vendor-specific extra surfaces under x_vendor, raw and non-authoritative.
    See docs/profile-extensions.md#core-vocabulary. The CAMARA retrieve/verify
    APIs are unchanged; this is a separate, namespaced resource.
servers:
  - url: https://{gateway}
    variables:
      gateway:
        default: localhost:8087
        description: CAMARA gateway host.
security:
  - bearerAuth: []
paths:
  /device-diagnostics/v0/{assetId}:
    get:
      summary: On-demand vendor fidelity for one asset.
      operationId: getDeviceDiagnostics
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
          description: CAMARA asset identifier (private-asset profile).
      responses:
        "200":
          description: Diagnostics for the asset's current source.
          content:
            application/json:
              schema:
                $ref: "https://jacobbista.github.io/5g-northbound/schema/device-diagnostics.schema.json"
        "401":
          description: Missing or invalid bearer token.
        "404":
          description: No asset behind the id, or the source exposes no diagnostics.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Keycloak-issued JWT (realm role `camara-location-read`).
