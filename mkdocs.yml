site_name: 5G Northbound
site_description: Open positioning stack exposing device location via the CAMARA APIs
site_url: https://jacobbista.github.io/5g-northbound/
repo_url: https://github.com/Jacobbista/5g-northbound
repo_name: Jacobbista/5g-northbound
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    # Top horizontal tabs for the top-level sections, with collapsible
    # sub-sections in the left sidebar - the clear menu the flat
    # navigation.sections layout was missing.
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: README.md
  - Overview: overview.md
  - Concepts:
      - Architecture: architecture.md
      - Blueprint vs bindings: blueprint-vs-bindings.md
      - Georeferencing: georeferencing.md
  - Guides:
      - Adapters: adapters.md
      - Integrating a vendor REST API: integrating-a-vendor-rest-api.md
      - Adapter registry & routing: adapter-registry.md
      - Asset registry: asset-registry.md
      - Fusion strategies: fusion-strategies.md
      - Deployment: deployment.md
  - Reference:
      - Data contracts: data-contracts.md
      - Machine-readable contracts: contracts.md
      - API reference: api-reference.md
      - Latency instrumentation: latency-instrumentation.md
  - CAMARA private-asset profile: https://github.com/Jacobbista/5g-northbound/blob/main/spec/private-profile/README.md
