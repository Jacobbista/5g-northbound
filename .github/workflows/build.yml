name: Build & Push

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # ghcr namespace mirrors the GitHub repo: ghcr.io/<owner>/<repo>/<service>
  IMAGE_PREFIX: ghcr.io/jacobbista/5g-northbound

jobs:
  build:
    name: build (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Production tier - published images.
          - { image: camara-gateway,     path: services/camara-gateway }
          - { image: positioning-engine, path: services/positioning-engine }
          - { image: wifi-positioning,   path: services/wifi-positioning }
          - { image: placement-editor,   path: services/placement-editor }
          - { image: positioning-demo,   path: services/positioning-demo }
          - { image: rest-adapter,       path: services/rest-adapter }
          # Mock tier - built and pushed too so a testbed without real
          # vendor creds can stand the stack up end-to-end. Tagged the same
          # way so consumers pin a specific build.
          - { image: mock-positioning,   path: mocks/mock-positioning }
          - { image: mock-wittra,        path: mocks/mock-wittra }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
            type=sha
          # On a v0.1.0 tag this yields :0.1.0, :latest and :sha-<short>
          flavor: latest=false

      - uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

# Package visibility: GitHub Packages default to private. Set each package to
# Public once (Repo > Packages > <pkg> > Package settings > Change visibility).
# GITHUB_TOKEN cannot change visibility, so this is a one-time manual step.
