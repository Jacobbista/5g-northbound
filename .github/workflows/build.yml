name: Build & Push

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # ghcr namespace mirrors the GitHub repo: ghcr.io/<owner>/<repo>/<service>
  IMAGE_PREFIX: ghcr.io/jacobbista/5g-northbound

jobs:
  # Decide which images to build. Every service is self-contained (its own
  # folder), so we build an image only when its path changed since the
  # previous tag. A tag therefore publishes exactly the images that actually
  # changed - the registry itself tells you what a release touched, and KELT
  # re-pins only those. workflow_dispatch (and the first-ever tag) builds all.
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      any: ${{ steps.set.outputs.any }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: set
        shell: bash
        run: |
          declare -A MAP=(
            [camara-gateway]=services/camara-gateway
            [positioning-engine]=services/positioning-engine
            [wifi-adapter]=services/wifi-adapter
            [vendor-adapter]=services/vendor-adapter
            [placement-editor]=services/placement-editor
            [location-app]=services/location-app
            [synthetic-adapter]=services/synthetic-adapter
          )
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BASE=""                       # manual run -> build everything
          else
            BASE="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          fi
          echo "diff base: ${BASE:-<none, building all>}"
          include="[]"
          for img in "${!MAP[@]}"; do
            path="${MAP[$img]}"
            if [ -z "$BASE" ] || [ -n "$(git diff --name-only "$BASE".."${GITHUB_REF_NAME}" -- "$path")" ]; then
              include="$(jq -c --arg i "$img" --arg p "$path" '. += [{"image":$i,"path":$p}]' <<<"$include")"
            fi
          done
          echo "building: $include"
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"
          [ "$(jq 'length' <<<"$include")" -gt 0 ] && echo "any=true" >> "$GITHUB_OUTPUT" || echo "any=false" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    name: build (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          # On a v0.1.0 tag this yields :0.1.0 and :latest. KELT pins by semver;
          # provenance rides the immutable sha256 digest every image already has.
          flavor: latest=false

      # The gateway self-serves the profile contracts (GET /contracts). They live
      # at the repo root, outside its build context, so stage them in first.
      - if: matrix.image == 'camara-gateway'
        run: make stage-contracts

      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

# mock-vendor is NOT published: it is a local schema-driven vendor cloud double for
# `make demo` only. In the testbed you point vendor-adapter at the real vendor.
#
# Package visibility: GitHub Packages default to private. Set each package to
# Public once (Repo > Packages > <pkg> > Package settings > Change visibility).
# GITHUB_TOKEN cannot change visibility, so this is a one-time manual step.
