name: Test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-python:
    name: pytest (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [camara-gateway, positioning-engine, wifi-positioning]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]"
          else
            pip install -r requirements.txt -r requirements-dev.txt
          fi
      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: pytest

  test-frontend:
    name: vitest (positioning-demo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: positioning-demo/package-lock.json
      - name: Install dependencies
        working-directory: positioning-demo
        run: npm ci
      - name: Run tests
        working-directory: positioning-demo
        run: npm test
