services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: changeme
    ports:
      - "8180:8080"
    volumes:
      - ./dev/keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - 5g-net

  wifi-adapter:
    build:
      context: ./services/wifi-adapter
    ports:
      - "8089:8080"
    # Run as the host user so the calibration tool can write back to the
    # bind-mounted bindings file (the Dockerfile's `app` user uid 1001 has
    # no rights on a host-owned file). The host uid is passed in via
    # docker-compose env; on Linux: `export HOST_UID=$(id -u)` before
    # `make demo`. Falls back to 1000, the typical first non-root uid.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      # Bindings file ONLY: tunables + id → BSSIDs mapping (+ calibration
      # samples written back at runtime). Stays a local RW file / PVC. The
      # blueprint (AP positions) is NOT here - it is fetched over HTTP from
      # the engine, the blueprint authority. Override at run time:
      # `export WIFI_CONFIG=./dev/wifi-config.local.json` (gitignored).
      - ${WIFI_CONFIG:-./dev/wifi-config.json}:/app/config/wifi-config.json
    environment:
      # Engine = blueprint authority + adapter registry. The adapter GETs
      # /blueprint from here and self-registers (POST /adapters) + heartbeats.
      POSITIONING_ENGINE_URL: "http://positioning-engine:8080"
      ADAPTER_NAME: "wifi"
      ADAPTER_KIND: "wifi"
      ADAPTER_BASE_URL: "http://wifi-adapter:8080"
      # Advertised capabilities (mirrors adapter.contract.yaml; validated by
      # `make positioning-check`). Drives the gateway's GET /capabilities.
      ADAPTER_CAPABILITIES: '{"source":"wifi","kinds":["tool","asset"],"frame":"local","streaming":false,"z":false,"accuracy_class":"metre","calibration":true,"devices":true}'
      # Set WIFI_DEBUG=1 in the shell before `make demo` to enable per-scan
      # trilateration diagnostics in this container's logs. Useful for
      # tuning tx_power / path_loss_n against a real venue.
      WIFI_DEBUG: "${WIFI_DEBUG:-0}"
    depends_on:
      positioning-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - 5g-net

  mock-vendor:
    build:
      context: ./mocks/mock-vendor
    ports:
      - "8091:8080"
    volumes:
      # The same schema vendor-adapter consumes. mock-vendor reads it and emits
      # responses that satisfy its mapping + serves them on the schema's URL
      # paths, behind the schema's auth, so the demo exercises the real vendor
      # path end to end. A different schema = a different vendor's shape here.
      - ./services/vendor-adapter/examples/wittra-schema.json:/app/config/schema.json:ro
    environment:
      SCHEMA_FILE: "/app/config/schema.json"
      # The account values the schema references via env; the mock checks a
      # request addresses this org/project and carries these credentials.
      WITTRA_ORG_ID: "demo-org"
      WITTRA_PROJECT_ID: "demo-prj"
      WITTRA_API_KEY: "demo-key"
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - 5g-net

  vendor-adapter:
    build:
      context: ./services/vendor-adapter
    ports:
      - "8092:8080"
    volumes:
      # In dev the example schema is mounted as the persistent schema file so
      # the adapter boots configured. In production the testbed PUTs the
      # schema via its vendor-integrations UI and the file lives on a PVC.
      - ./services/vendor-adapter/examples/wittra-schema.json:/app/data/schema.json
    environment:
      # Defaults below target the local mock-vendor fake so `make demo` runs
      # end-to-end on a fresh clone. To talk to a real Wittra cloud, copy
      # vendor-adapter/.env.example to vendor-adapter/.env, fill it in, then
      # `set -a; . vendor-adapter/.env; set +a; make demo` (or set the four
      # vars any other way). In K8s these come from a Secret instead.
      WITTRA_BASE_URL: "${WITTRA_BASE_URL:-http://mock-vendor:8080}"
      WITTRA_ORG_ID: "${WITTRA_ORG_ID:-demo-org}"
      WITTRA_PROJECT_ID: "${WITTRA_PROJECT_ID:-demo-prj}"
      WITTRA_API_KEY: "${WITTRA_API_KEY:-demo-key}"
      # Verbose discover logging. Set VENDOR_ADAPTER_DEBUG=1 in the shell
      # before `make demo` to dump GET URLs + response previews into the
      # vendor-adapter container's logs (useful when wiring a new vendor
      # schema or chasing a real cloud returning 0 devices).
      VENDOR_ADAPTER_DEBUG: "${VENDOR_ADAPTER_DEBUG:-0}"
      # Self-register with the engine's adapter registry.
      POSITIONING_ENGINE_URL: "http://positioning-engine:8080"
      ADAPTER_NAME: "wittra"
      ADAPTER_KIND: "vendor"
      ADAPTER_BASE_URL: "http://vendor-adapter:8080"
      ADAPTER_CAPABILITIES: '{"source":"wittra","kinds":["pallet","uwb-tag","asset"],"frame":"wgs84","streaming":false,"z":true,"accuracy_class":"sub-metre","discover":true,"devices":true}'
    depends_on:
      mock-vendor:
        condition: service_healthy
      positioning-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - 5g-net

  synthetic-adapter:
    build:
      context: ./services/synthetic-adapter
    ports:
      - "8090:8080"
    volumes:
      # Walk inside the operator's actual room: the walker reads room bounds +
      # walls AND the floor-plan frame (room base + georef height) so it emits
      # in the engine's `local` frame (floor-plan-local, north-up). Same seed
      # blueprint the engine boots from, so the synthetic device lands among the
      # anchors instead of in an arbitrary box.
      - ./services/location-app/public/layout.json:/app/config/layout.json:ro
    environment:
      LAYOUT_PATH: "/app/config/layout.json"
      # Fallback bounds when no layout is mounted; the layout overrides these.
      WIDTH_M: "13"
      DEPTH_M: "32"
      HEIGHT_M: "3"
      SPEED_MPS: "1.0"
      # Self-register with the engine's adapter registry.
      POSITIONING_ENGINE_URL: "http://positioning-engine:8080"
      ADAPTER_NAME: "synthetic"
      ADAPTER_KIND: "synthetic"
      ADAPTER_BASE_URL: "http://synthetic-adapter:8080"
      # The walker can synthesise a position for any id; scope it so it 404s for
      # devices it does not own, keeping engine fan-out (no DEVICE_MAP) clean.
      DEVICE_IDS: "synthetic-demo-01"
      # Fixed anchors this on-premise RTLS substitute exposes: surfaced on
      # /devices as role=infrastructure (never onboarded as assets), so the demo
      # exercises both onboarding classes. SOURCE_CLASS tags the technology.
      ANCHOR_IDS: "synthetic-anchor-01,synthetic-anchor-02"
      SOURCE_CLASS: "uwb"
      ADAPTER_CAPABILITIES: '{"source":"synthetic","kinds":["forklift","asset"],"frame":"local","streaming":false,"z":true,"accuracy_class":"coarse","devices":true}'
    depends_on:
      positioning-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - 5g-net

  positioning-engine:
    build:
      context: ./services/positioning-engine
    ports:
      - "8081:8080"
      - "8082:8080"
    volumes:
      # The engine is the blueprint authority: it persists the blueprint on a
      # named volume (survives restarts) and serves it via GET/PUT /blueprint.
      # On first boot the store is empty, so it seeds once from the committed
      # dev blueprint mounted read-only below.
      - engine-blueprint:/app/data
      - ./services/location-app/public/layout.json:/app/config/seed-blueprint.json:ro
      # Versioned layout schema (read-only): the engine best-effort validates
      # PUT /blueprint against it. Absent in prod -> validation degrades to no-op.
      - ./schema:/app/schema:ro
    environment:
      BLUEPRINT_SEED_PATH: "/app/config/seed-blueprint.json"
      DEVICE_IDS: "wifi-asset-01,synthetic-demo-01,wittra-tag-01"
      # No ADAPTER_URLS: adapters self-register with the engine (POST /adapters)
      # and heartbeat. See docs/adapter-registry.md.
      # No DEVICE_MAP: routing is capability-driven. The CAMARA gateway passes
      # the asset's source (?source=) so the engine polls that adapter directly;
      # the stream fans out to all adapters and each 404s for devices it does
      # not serve (the synthetic adapter is scoped via DEVICE_IDS). DEVICE_MAP is still
      # honoured if set, as a cold-start override.
      # Fusion strategy applied to the merged measurements (see docs/fusion-strategies.md).
      FUSION_STRATEGY: "weighted_avg"
      # WebSocket broadcast cadence. The demo does not subscribe so the loop is
      # a no-op, but keep it well above 500 ms to avoid wasted wake-ups.
      WEBSOCKET_INTERVAL_MS: "2000"
    # No depends_on adapters: the engine boots independently (it is the
    # blueprint authority the adapters fetch from) and tolerates adapters being
    # down via per-adapter cooldown. This breaks the engine<->adapter cycle so
    # the adapters can depend on the engine for their blueprint.
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - 5g-net

  camara-gateway:
    build:
      context: ./services/camara-gateway
    ports:
      # host 8080 is taken by the IDE here; gateway published on a free port
      - "8087:8080"
    volumes:
      # Asset Identity Map: the gateway is the network authority (GET/PUT
      # /assets), mirroring the engine's blueprint store. Persisted on a named
      # volume (survives restarts); seeded once from the committed dev fixture
      # mounted read-only. Authoring is over HTTP, never by editing a mount.
      - gateway-assets:/app/data
      - ./dev/assets.json:/app/config/assets.seed.json:ro
    environment:
      # Real auth by default: the browser demo logs in via Keycloak (PKCE) and
      # every gateway call carries a Bearer token. Override to skip for a
      # throwaway run: `SKIP_AUTH=true make demo`.
      SKIP_AUTH: "${SKIP_AUTH:-false}"
      POSITIONING_ENGINE_URL: "http://positioning-engine:8080"
      WIFI_ADAPTER_URL: "http://wifi-adapter:8080"
      KEYCLOAK_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: "5g-testbed"
      ASSET_STORE_FILE: "/app/data/assets.json"
      ASSET_SEED_FILE: "/app/config/assets.seed.json"
    depends_on:
      positioning-engine:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - 5g-net

  location-app:
    build:
      context: ./services/location-app
    ports:
      - "3002:80"
    volumes:
      # runtime env (window.__ENV__) - overrides config without a rebuild.
      # The blueprint is NOT mounted: the demo fetches it from the CAMARA
      # gateway (GET /blueprint), which proxies the engine.
      - ./services/location-app/public/env-config.js:/usr/share/nginx/html/env-config.js:ro
    depends_on:
      camara-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - 5g-net

  placement-editor:
    build:
      context: ./services/placement-editor
    ports:
      - "3003:8080"
    volumes:
      # Hot-edit runtime config: bind-mount the gitignored env-config.js so
      # the operator can paste a Mapbox token (or any other window.__ENV__
      # override) and reload the browser, no rebuild. Read-only - the
      # container's entrypoint.sh skips regeneration when the file is RO.
      - ./services/placement-editor/frontend/public/env-config.js:/app/static/env-config.js:ro
    environment:
      # The editor is a blueprint write-client: GET/PUT the blueprint over HTTP
      # from the engine (the authority). No shared blueprint volume.
      POSITIONING_ENGINE_URL: "http://positioning-engine:8080"
      # Upstream for the calibration proxy (browser -> placement-editor ->
      # wifi-adapter). Internal service name on the compose network.
      WIFI_ADAPTER_URL: "http://wifi-adapter:8080"
      # Upstream for the vendor discovery proxy.
      VENDOR_ADAPTER_URL: "http://vendor-adapter:8080"
      # Asset Identity Map authority, proxied at /api/assets (GET/PUT) for an
      # onboarding client. Onboarding UI itself is the KELT dashboard's.
      CAMARA_GATEWAY_URL: "http://camara-gateway:8080"
      # Optional Mapbox public token. When set, the editor exposes a
      # "Satellite (Mapbox)" basemap. Leave empty to keep ESRI only.
      VITE_MAPBOX_TOKEN: "${VITE_MAPBOX_TOKEN:-}"
    depends_on:
      positioning-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - 5g-net

volumes:
  # Persists the engine's authored blueprint across restarts (the engine is
  # the blueprint authority). Seeded once from the committed dev blueprint.
  engine-blueprint:
  # Persists the gateway's Asset Identity Map (the gateway is the asset
  # authority). Seeded once from dev/assets.json.
  gateway-assets:

networks:
  5g-net:
    driver: bridge
