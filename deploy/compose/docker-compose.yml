services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: changeme
    ports:
      - "8180:8080"
    volumes:
      - ./dev/keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - 5g-net

  mock-smf:
    image: python:3.11-slim
    command: python /app/mock_smf.py
    volumes:
      - ./dev/mock_smf.py:/app/mock_smf.py:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:9090/session-info', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - 5g-net

  wifi-positioning:
    build:
      context: ./services/wifi-positioning
    ports:
      - "8089:8080"
    # Run as the host user so the calibration tool can write back to the
    # bind-mounted bindings file (the Dockerfile's `app` user uid 1001 has
    # no rights on a host-owned file). The host uid is passed in via
    # docker-compose env; on Linux: `export HOST_UID=$(id -u)` before
    # `make demo`. Falls back to 1000, the typical first non-root uid.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      # Bindings file ONLY: tunables + id → BSSIDs mapping (+ calibration
      # samples written back at runtime). Stays a local RW file / PVC. The
      # blueprint (AP positions) is NOT here - it is fetched over HTTP from
      # the engine, the blueprint authority. Override at run time:
      # `export WIFI_CONFIG=./dev/wifi-config.local.json` (gitignored).
      - ${WIFI_CONFIG:-./dev/wifi-config.json}:/app/config/wifi-config.json
    environment:
      # Engine = blueprint authority + adapter registry. The adapter GETs
      # /blueprint from here and self-registers (POST /adapters) + heartbeats.
      POSITIONING_ENGINE_URL: "http://positioning-engine:8080"
      ADAPTER_NAME: "wifi"
      ADAPTER_KIND: "wifi"
      ADAPTER_BASE_URL: "http://wifi-positioning:8080"
      # Set WIFI_DEBUG=1 in the shell before `make demo` to enable per-scan
      # trilateration diagnostics in this container's logs. Useful for
      # tuning tx_power / path_loss_n against a real venue.
      WIFI_DEBUG: "${WIFI_DEBUG:-0}"
    depends_on:
      positioning-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - 5g-net

  mock-wittra:
    build:
      context: ./mocks/mock-wittra
    ports:
      - "8091:8080"
    environment:
      MOCK_WITTRA_ORG_ID: "demo-org"
      MOCK_WITTRA_PROJECT_ID: "demo-prj"
      MOCK_WITTRA_API_KEY: "demo-key"
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - 5g-net

  rest-adapter:
    build:
      context: ./services/rest-adapter
    ports:
      - "8092:8080"
    volumes:
      # In dev the example schema is mounted as the persistent schema file so
      # the adapter boots configured. In production the testbed PUTs the
      # schema via its vendor-integrations UI and the file lives on a PVC.
      - ./services/rest-adapter/examples/wittra-schema.json:/app/data/schema.json
    environment:
      # Defaults below target the local mock-wittra fake so `make demo` runs
      # end-to-end on a fresh clone. To talk to a real Wittra cloud, copy
      # rest-adapter/.env.example to rest-adapter/.env, fill it in, then
      # `set -a; . rest-adapter/.env; set +a; make demo` (or set the four
      # vars any other way). In K8s these come from a Secret instead.
      WITTRA_BASE_URL: "${WITTRA_BASE_URL:-http://mock-wittra:8080}"
      WITTRA_ORG_ID: "${WITTRA_ORG_ID:-demo-org}"
      WITTRA_PROJECT_ID: "${WITTRA_PROJECT_ID:-demo-prj}"
      WITTRA_API_KEY: "${WITTRA_API_KEY:-demo-key}"
      # Verbose discover logging. Set REST_ADAPTER_DEBUG=1 in the shell
      # before `make demo` to dump GET URLs + response previews into the
      # rest-adapter container's logs (useful when wiring a new vendor
      # schema or chasing a real cloud returning 0 devices).
      REST_ADAPTER_DEBUG: "${REST_ADAPTER_DEBUG:-0}"
      # Self-register with the engine's adapter registry.
      POSITIONING_ENGINE_URL: "http://positioning-engine:8080"
      ADAPTER_NAME: "wittra"
      ADAPTER_KIND: "vendor"
      ADAPTER_BASE_URL: "http://rest-adapter:8080"
    depends_on:
      mock-wittra:
        condition: service_healthy
      positioning-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - 5g-net

  mock-positioning:
    build:
      context: ./mocks/mock-positioning
    ports:
      - "8090:8080"
    environment:
      # Synthetic walker - bounds come from env, no blueprint needed. A mock
      # does not consume the real venue geometry; it just produces continuous
      # motion inside a box.
      WIDTH_M: "13"
      DEPTH_M: "32"
      HEIGHT_M: "3"
      SPEED_MPS: "1.0"
      # Self-register with the engine's adapter registry.
      POSITIONING_ENGINE_URL: "http://positioning-engine:8080"
      ADAPTER_NAME: "mock"
      ADAPTER_KIND: "mock"
      ADAPTER_BASE_URL: "http://mock-positioning:8080"
    depends_on:
      positioning-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - 5g-net

  positioning-engine:
    build:
      context: ./services/positioning-engine
    ports:
      - "8081:8080"
      - "8082:8080"
    volumes:
      # The engine is the blueprint authority: it persists the blueprint on a
      # named volume (survives restarts) and serves it via GET/PUT /blueprint.
      # On first boot the store is empty, so it seeds once from the committed
      # dev blueprint mounted read-only below.
      - engine-blueprint:/app/data
      - ./services/positioning-demo/public/layout.json:/app/config/seed-blueprint.json:ro
    environment:
      BLUEPRINT_SEED_PATH: "/app/config/seed-blueprint.json"
      DEVICE_IDS: "wifi-asset-01,mock-demo-01,wittra-tag-01"
      # No ADAPTER_URLS: adapters self-register with the engine (POST /adapters)
      # and heartbeat. ADAPTER_URLS stays supported as a cold-start seed for
      # deployments that prefer it, but the dev stack exercises the real
      # self-registration model. See docs/adapter-registry.md.
      # Per-device routing: each device is pinned to a single adapter so the
      # demo can show real "online vs offline" semantics. mock-demo-01 always
      # has a fix (synthetic walker); wifi-asset-01 stays offline until a real
      # WiFi scan is pushed to the wifi adapter - the demo will render the
      # device as offline in the meantime instead of falling back to mock.
      # wittra-tag-01 routes to the rest-adapter, which translates Wittra's
      # cloud REST shape into the engine's Measurement contract.
      DEVICE_MAP: "mock-demo-01=mock,wifi-asset-01=wifi,wittra-tag-01=wittra"
      # Fusion strategy applied to the merged measurements (see docs/fusion-strategies.md).
      FUSION_STRATEGY: "weighted_avg"
      # WebSocket broadcast cadence. The demo does not subscribe so the loop is
      # a no-op, but keep it well above 500 ms to avoid wasted wake-ups.
      WEBSOCKET_INTERVAL_MS: "2000"
    # No depends_on adapters: the engine boots independently (it is the
    # blueprint authority the adapters fetch from) and tolerates adapters being
    # down via per-adapter cooldown. This breaks the engine<->adapter cycle so
    # the adapters can depend on the engine for their blueprint.
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - 5g-net

  camara-gateway:
    build:
      context: ./services/camara-gateway
    ports:
      # host 8080 is taken by the IDE here; gateway published on a free port
      - "8087:8080"
    volumes:
      # Device registry: anagrafica (phoneNumber, deviceId, label). Edit the
      # file and restart the gateway to register a new device.
      - ./dev/devices.json:/app/config/devices.json:ro
    environment:
      SKIP_AUTH: "true"
      SMF_URL: "http://mock-smf:9090"
      POSITIONING_ENGINE_URL: "http://positioning-engine:8080"
      KEYCLOAK_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: "5g-testbed"
      DEVICE_REGISTRY_FILE: "/app/config/devices.json"
    depends_on:
      positioning-engine:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - 5g-net

  positioning-demo:
    build:
      context: ./services/positioning-demo
    ports:
      - "3002:80"
    volumes:
      # runtime env (window.__ENV__) - overrides config without a rebuild.
      # The blueprint is NOT mounted: the demo fetches it from the CAMARA
      # gateway (GET /blueprint), which proxies the engine.
      - ./services/positioning-demo/public/env-config.js:/usr/share/nginx/html/env-config.js:ro
    depends_on:
      camara-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - 5g-net

  placement-editor:
    build:
      context: ./services/placement-editor
    ports:
      - "3003:8080"
    volumes:
      # Hot-edit runtime config: bind-mount the gitignored env-config.js so
      # the operator can paste a Mapbox token (or any other window.__ENV__
      # override) and reload the browser, no rebuild. Read-only - the
      # container's entrypoint.sh skips regeneration when the file is RO.
      - ./services/placement-editor/frontend/public/env-config.js:/app/static/env-config.js:ro
    environment:
      # The editor is a blueprint write-client: GET/PUT the blueprint over HTTP
      # from the engine (the authority). No shared blueprint volume.
      POSITIONING_ENGINE_URL: "http://positioning-engine:8080"
      # Upstream for the calibration proxy (browser -> placement-editor ->
      # wifi-positioning). Internal service name on the compose network.
      WIFI_POSITIONING_URL: "http://wifi-positioning:8080"
      # Upstream for the vendor discovery proxy.
      REST_ADAPTER_URL: "http://rest-adapter:8080"
      # Optional Mapbox public token. When set, the editor exposes a
      # "Satellite (Mapbox)" basemap. Leave empty to keep ESRI only.
      VITE_MAPBOX_TOKEN: "${VITE_MAPBOX_TOKEN:-}"
    depends_on:
      positioning-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - 5g-net

volumes:
  # Persists the engine's authored blueprint across restarts (the engine is
  # the blueprint authority). Seeded once from the committed dev blueprint.
  engine-blueprint:

networks:
  5g-net:
    driver: bridge
