# Example manifest for one service. The ConfigMap and the Secret are the
# output of `python3 deploy/tools/contracts.py render-k8s placement-editor`.
# The editor stores nothing: the blueprint lives in the positioning-engine.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: placement-editor-config
  namespace: 5g-northbound
data:
  POSITIONING_ENGINE_URL: http://positioning-engine:8080
  WIFI_ADAPTER_URL: http://wifi-adapter:8080
  VENDOR_ADAPTER_URL: http://vendor-adapter:8080
---
apiVersion: v1
kind: Secret
metadata:
  name: placement-editor-secrets
  namespace: 5g-northbound
type: Opaque
stringData:
  # Optional Mapbox public token. When set, the editor offers a Mapbox
  # satellite layer.
  VITE_MAPBOX_TOKEN: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: placement-editor
  namespace: 5g-northbound
  labels:
    app.kubernetes.io/name: placement-editor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: placement-editor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: placement-editor
    spec:
      containers:
        - name: placement-editor
          image: ghcr.io/jacobbista/5g-northbound/placement-editor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: placement-editor-config
            - secretRef:
                name: placement-editor-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: placement-editor
  namespace: 5g-northbound
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: placement-editor
  ports:
    - port: 8080
      targetPort: 8080
